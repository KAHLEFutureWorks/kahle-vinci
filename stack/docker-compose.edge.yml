services:
  caddy:
    image: caddy:2.11.3-alpine
    container_name: caddy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./caddy/Caddyfile.maintenance:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data: {}
  caddy_config: {}