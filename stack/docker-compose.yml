services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is required}
      AIOHTTP_CLIENT_TIMEOUT: "900"

      # IONOS AI Model Hub via OpenAI-compatible API
      ENABLE_PERSISTENT_CONFIG: "False"
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: ${IONOS_OPENAI_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      OPENAI_API_KEY: ${IONOS_API_TOKEN:-${IONOS_API_KEY:?IONOS_API_TOKEN or IONOS_API_KEY is required}}
      TASK_MODEL_EXTERNAL: ${IONOS_CHAT_MODEL_DEFAULT:-mistralai/Mistral-Small-24B-Instruct}
      IONOS_CHAT_MODEL_DEFAULT: ${IONOS_CHAT_MODEL_DEFAULT:-mistralai/Mistral-Small-24B-Instruct}
      IONOS_CHAT_MODEL_REASONING: ${IONOS_CHAT_MODEL_REASONING:-openai/gpt-oss-120b}

      # RAG embeddings use IONOS BGE-M3. Existing Qdrant/Open WebUI vectors must be reindexed.
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: ${IONOS_OPENAI_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      RAG_OPENAI_API_KEY: ${IONOS_API_TOKEN:-${IONOS_API_KEY:?IONOS_API_TOKEN or IONOS_API_KEY is required}}
      RAG_EMBEDDING_MODEL: ${IONOS_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBEDDING_BATCH_SIZE: "1"
      RAG_EMBEDDING_OPENAI_BATCH_SIZE: "1"
      # Chat uploads are processed for direct file context/file tools, but not auto-indexed into OpenWebUI RAG.
      # KAHLE-Vinci uses kb-sync + Qdrant for managed knowledgebases; this avoids IONOS embedding rate limits on every upload.
      BYPASS_EMBEDDING_AND_RETRIEVAL: "True"
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333

      # KAHLE-Vinci Tool-Haertung
      KV_CURRENT_YEAR: "2026"
      KV_STRICT_NOTICE_ONLY: "1"
      KV_FIX_YEAR_IN_QUERY: "0"

      N8N_SAFE_WEBSEARCH_WEBHOOK_URL: ${N8N_SAFE_WEBSEARCH_WEBHOOK_URL:-http://n8n:5678/webhook/safe-websearch/h576htdr-5b9t-89r8-61wx-8a50bh988m6a}
      N8N_SAFE_WEBSEARCH_API_KEY: ${N8N_SAFE_WEBSEARCH_API_KEY:-}
      N8N_SAFE_WEBSEARCH_TIMEOUT: ${N8N_SAFE_WEBSEARCH_TIMEOUT:-50}
      OWUI_FILE_PROXY_URL: http://owui-file-proxy:8091
      OWUI_FILE_PROXY_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      PUBLIC_FILE_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8091}
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [
          {"title":["Kundenmail formulieren","freundlich, klar, autohausnah"],"content":"Formuliere eine freundliche Antwort an einen Kunden. Nutze förmliches Sie, bleibe verbindlich und verwende Platzhalter für Namen, Standort und Kontaktdaten. Anliegen: "},
          {"title":["Servicefall zusammenfassen","für Werkstatt oder Serviceleitung"],"content":"Fasse den folgenden Service- oder Werkstattfall intern zusammen: Ausgangslage, Kundenanliegen, bisherige Schritte, offener Punkt und empfohlener nächster Schritt. Text: "},
          {"title":["Fahrzeug argumentieren","Verkaufsgespräch vorbereiten"],"content":"Erstelle eine sachliche Argumentationshilfe für ein Verkaufsgespräch. Berücksichtige Kundennutzen, Einwände, passende Fragen und eine kurze Abschlussformulierung. Fahrzeug/Kontext: "},
          {"title":["Internes Wissen prüfen","Richtlinie, Prozess oder Standort"],"content":"Prüfe unser internes KAHLE-Wissen zu folgendem Thema und antworte nur auf Basis der internen Informationen: "},
          {"title":["Text verbessern","professionell und verständlich"],"content":"Überarbeite den folgenden Text so, dass er klar, professionell und gut verständlich ist. Erhalte die Aussage, entferne Füllwörter und formuliere passend für den Autohauskontext. Text: "},
          {"title":["Aufgabenliste erstellen","Prioritäten und nächste Schritte"],"content":"Erstelle aus dem folgenden Anliegen eine kurze Aufgabenliste mit Priorität, Fälligkeit falls erkennbar und konkretem nächsten Schritt. Anliegen: "}
        ]

      TOOLS_FUNCTION_CALLING_PROMPT_TEMPLATE: |-
       Available Tools: {{TOOLS}}
       Return ONLY valid JSON:
       {"tool_calls":[{"name":"<tool>","parameters":{...}}]}
       RULES:
       - For every follow-up asking for more detail from KAHLE-internal knowledge, call rag_chat again. Make query standalone and carry forward the prior document/product identifier, e.g. "A1a Assessment-Framework 5 Readiness-Dimensionen". Never answer such follow-ups only from chat history.
       - create_calendar_event is a two-step write operation. Never call it on the first request. First require an explicit title/topic, date and time, show a complete summary and ask for confirmation.
       - Call create_calendar_event only when the current user message explicitly confirms the immediately preceding calendar summary. Never invent a title, date or time. The calendar is internal to OpenWebUI and the current tool cannot manage attendees or invitations.
       - For safe_webcaller/safe_websearch, set query to a concise search-engine query, not to the full conversational user sentence. Include main entity, aspect, region/language, and timeframe when present.
       - For current/news/latest web searches, include 2026 or the explicit date/range from the user. Do not add unrelated years.
       - Do not include chat filler in search queries, e.g. "bitte", "recherchiere", "kannst du".
       - Set lang="de-DE" and maxResults=5 when present.
       - Current year: 2026 (Europe/Berlin). Do not add any year unless the user wrote it.
       - For explicit file editing/conversion tasks, prefer *_save tools from the proxy.
       - Word/DOCX -> Markdown: file_to_md_save. Never use file_to_docx_save for a Markdown request.
       - Word/DOCX -> PDF: docx_to_pdf_save.
       - Uploaded-file conversion takes precedence over kahle_workflow. Do not research, summarize, rewrite or enrich the document unless explicitly requested.
       - kahle_workflow is only for a newly generated document, not for converting an attached file.
       - files_extract_text is the read-only tool for reading, analyzing, reviewing, checking, extracting, summarizing or comparing attached files in chat. Call it once with all exact relevant filenames. It never edits files and never creates a download.
       - If two or more files are attached and the user asks for a comparison, differences, changes, a review, or an old/new version analysis, call files_extract_text once with all relevant file_paths. Never call file_to_md_save, file_to_docx_save, bundle_to_md_save or another *_save tool for the comparison itself.
       - Use an *_save tool only when the user explicitly requests a converted, edited, merged, or downloadable output file and exact filename(s) are known from the current message context.
       - Exact filenames are listed in the user query block under: "Attached files in this message (use exact names for any file tool call):"
       - Use those names verbatim for file_path/file_paths.
       - If the user asks for "the attached file" and exactly one attached filename is present in the current message context, use that filename directly; do not ask for confirmation.
       - If exact filename(s) are missing/ambiguous, return {"tool_calls":[]} and ask one short clarification question for the exact filename(s).
       - Never call /files/download as a tool; it is only for user-facing links.
       - For file tools, require exact uploaded filename(s) in file_path/file_paths.
       - Never prefix with "uploads/".
       - Never use wildcards, placeholders, or "latest" for file_path/file_paths.
       - Never invent or guess filenames; use only real uploaded filenames from context.
       - Routing hints for attached files:
       - explicit conversion of PDF/DOCX/TXT/MD/XLSX/CSV -> downloadable markdown: file_to_md_save
       - explicit conversion of PDF/DOCX/TXT/MD/XLSX/CSV -> downloadable Word/DOCX: file_to_docx_save
       - generated research/text -> markdown/txt/csv download: text_create_save
       - generated research/text -> Word/DOCX download: docx_create_save
       - generated research/text -> PDF download: pdf_create_save
       - generated research/text -> PowerPoint/PPTX download: pptx_create_save
       - Creating a new file from research/result/answer/history never requires an uploaded filename.
       - If one user request combines research/web/RAG AND a downloadable PDF/DOCX/PPTX/MD output, prefer kahle_workflow_execute once and set output_format to "pdf", "docx", "pptx", or "md". Do not split this into separate search and file tools.
       - For docx_create_save/pdf_create_save/pptx_create_save/text_create_save, parameters MUST include filename and content. Never call these tools with {}.
       - If the user asks to create a file "from the result", "from this", or "from the previous answer", set content to the full relevant ASSISTANT message from History.
       - If no relevant generated content exists in History, return {"tool_calls":[]} and ask what content should be put into the file.
       - DOCX -> PDF: docx_to_pdf_save
       - DOCX replace text: docx_replace_one_save
       - DOCX delete last paragraphs: docx_delete_last_paragraphs_save
       - PDF remove pages: pdf_remove_pages_save
       - PDF merge: pdf_merge_save
       - XLSX cell updates: xlsx_update_cells_save
       - For xlsx_update_cells_save, updates MUST NOT be empty.
       - For large XLSX ranges, use a compact update object instead of thousands of single cells, e.g. {"range":"A2:A500","generator":"random_money","min":1000,"max":100000,"decimals":2}
       - multi-file master context markdown: bundle_to_md_save
       - If a tool result contains download_url, do not reconstruct file content; return only download_url and metadata.
       If no tool: {"tool_calls":[]}

      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "8"
      IONOS_MODEL_LIST_RETRIES: "3"
      IONOS_MODEL_LIST_RETRY_DELAY_SECONDS: "0.5"
      IONOS_MODEL_FALLBACK_IDS: "mistralai/Mistral-Small-24B-Instruct,openai/gpt-oss-120b,Qwen/Qwen3.5-397B-A17B"
      ENABLE_DIRECT_CONNECTIONS: "True"
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"openapi","url":"http://owui-file-proxy:8091","spec_type":"url","spec":"","path":"openapi.json","auth_type":"bearer","key":"${OWUI_FILE_PROXY_API_KEY}","config":{"enable":true},"info":{"id":"doc-worker","name":"Document Worker","description":"Local DOCX/XLSX/PDF file editing tools"}}]
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "True"
      OWUI_APPEND_ATTACHED_FILE_NAMES_TO_USER_MESSAGE: "True"
      KAHLE_TASKS_DB_PATH: /app/backend/data/kahle_vinci_tasks.db
      KB_ROOT: /knowledgebases
      KB_STATE_PATH: /kb-sync-state/kb-sync-state.json
      KB_SYNC_COLLECTIONS: kahleallgemein,kahlekontext,kahlerichtlinien
      KB_ADMIN_API_URL: http://kb-admin-api:8092
      KB_ADMIN_MAINTENANCE_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      KB_SYNC_URL: http://kb-sync:8093
      HYBRID_COLLECTION_ALIAS: vinci_knowledge
      KAHLE_KNOWLEDGE_HARNESS_MODE: ${KAHLE_KNOWLEDGE_HARNESS_MODE:-active}
      PERSONIO_DIRECTORY_URL: http://personio-directory:8094
      PERSONIO_DIRECTORY_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
    volumes:
      - open-webui:/app/backend/data
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/knowledgebases:/knowledgebases:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-sync-state:/kb-sync-state:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/stack/open-webui-overrides/open_webui/routers/openai.py:/app/backend/open_webui/routers/openai.py:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/stack/open-webui-overrides/open_webui/utils/kahle_knowledge_harness.py:/app/backend/open_webui/utils/kahle_knowledge_harness.py:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/stack/open-webui-overrides/open_webui/utils/personio_directory_client.py:/app/backend/open_webui/utils/personio_directory_client.py:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/stack/open-webui-overrides/open_webui/utils/middleware.py:/app/backend/open_webui/utils/middleware.py:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/stack/open-webui-overrides/open_webui/utils/misc.py:/app/backend/open_webui/utils/misc.py:ro"
    depends_on:
      document-worker:
        condition: service_healthy
      owui-file-proxy:
        condition: service_healthy
      qdrant:
        condition: service_started
      personio-directory:
        condition: service_started
    networks:
      - appnet

  owui-file-proxy:
    image: stack-owui-file-proxy
    build:
      context: ./owui-file-proxy
      dockerfile: Dockerfile
    container_name: owui-file-proxy
    restart: unless-stopped
    environment:
      OWUI_UPLOAD_DIR: /app/backend/data/uploads
      DOC_WORKER_URL: http://document-worker:8090
      TOOL_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      WORKER_API_KEY: ${DOC_WORKER_API_KEY:?DOC_WORKER_API_KEY is required}
      REQUIRE_TOOL_API_KEY: "true"
      REQUIRE_EXACT_FILE_PATH: "true"
      DISALLOW_WILDCARDS: "true"
      OWUI_OUTPUT_SUBDIR: edited
      OWUI_DB_PATH: /app/backend/data/webui.db
      OWUI_LOG_CLEANUP_REPORT_PATH: /retention-reports/openwebui_log_cleanup_report.json
      OWUI_LOG_CLEANUP_STALE_HOURS: "36"
      KB_ROOT: /knowledgebases
      KAHLE_TASKS_DB_PATH: /app/backend/data/kahle_vinci_tasks.db
      KB_EXPIRY_DEFAULT_NOTIFY_DAYS: "14"
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:?FILE_LINK_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8091}
      KAHLE_ASSETS_ROOT: /assets
      KAHLE_DOCX_TEMPLATE: /assets/templates/docx/KAHLE-DOCX-VORLAGE.docx
      KAHLE_PDF_TEMPLATE: /assets/templates/pdf/KAHLE-PDF-VORLAGE.pdf
      KAHLE_PPTX_TEMPLATE: /assets/templates/pptx/KAHLE-PPTX-Vorlage.pptx
      KAHLE_BRAND_CONFIG: /assets/brand/colors/kahle-brand.json
      KAHLE_LOGO_PRIMARY: /assets/brand/logos/Logo_Kahle_Gruppe_positiv.png
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - open-webui:/app/backend/data
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/knowledgebases:/knowledgebases:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/assets:/assets:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/stack/retention-reports:/retention-reports:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5).getcode()==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      document-worker:
        condition: service_healthy
    networks:
      - appnet

  kb-admin-api:
    build:
      context: ./kb-admin-api
      dockerfile: Dockerfile
    container_name: kb-admin-api
    restart: unless-stopped
    user: "${KB_ADMIN_UID:-1000}:${KB_ADMIN_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      KB_ROOT: /knowledgebases
      KB_STATE_PATH: /state/kb-sync-state.json
      QDRANT_URL: http://qdrant:6333
      OPENWEBUI_URL: http://open-webui:8080
      KB_SYNC_URL: http://kb-sync:8093
      DOCUMENT_WORKER_URL: http://document-worker:8090
      DOCUMENT_WORKER_API_KEY: ${DOC_WORKER_API_KEY:?DOC_WORKER_API_KEY is required}
      KB_CLAMAV_HOST: clamav
      KB_CLAMAV_PORT: "3310"
      IONOS_OPENAI_BASE_URL: ${IONOS_OPENAI_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      IONOS_API_KEY: ${IONOS_API_TOKEN:-${IONOS_API_KEY:?IONOS_API_TOKEN or IONOS_API_KEY is required}}
      IONOS_EMBEDDING_MODEL: ${IONOS_EMBEDDING_MODEL:-BAAI/bge-m3}
      IONOS_CHAT_MODEL_DEFAULT: ${IONOS_CHAT_MODEL_DEFAULT:-mistralai/Mistral-Small-24B-Instruct}
      KB_ADMIN_COLLECTIONS: kahleallgemein,kahlekontext,kahlerichtlinien
      KB_ADMIN_MAX_UPLOAD_BYTES: "52428800"
      KB_PORTAL_DB_PATH: /portal-data/wissensportal.sqlite3
      KB_PORTAL_AUTO_ACTIVATION_ENABLED: "${KB_PORTAL_AUTO_ACTIVATION_ENABLED:-false}"
      PORTAL_ALLOWED_EMAIL_DOMAINS: ${PORTAL_ALLOWED_EMAIL_DOMAINS:-kahle.de}
      KB_ADMIN_TRASH_RETENTION_DAYS: "30"
      KB_ADMIN_MAINTENANCE_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      KB_ADMIN_UNLOCK_CODE_HASH: ${KB_ADMIN_UNLOCK_CODE_HASH:-}
      KB_ADMIN_UNLOCK_SESSION_SECRET: ${KB_ADMIN_UNLOCK_SESSION_SECRET:-}
      KB_ADMIN_UNLOCK_TTL_SECONDS: ${KB_ADMIN_UNLOCK_TTL_SECONDS:-28800}
      KB_ADMIN_UNLOCK_MAX_ATTEMPTS: ${KB_ADMIN_UNLOCK_MAX_ATTEMPTS:-5}
      KB_ADMIN_UNLOCK_BLOCK_SECONDS: ${KB_ADMIN_UNLOCK_BLOCK_SECONDS:-900}
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/knowledgebases:/knowledgebases"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-sync-state:/state:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-portal-data:/portal-data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=5).getcode()==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      open-webui:
        condition: service_started
      qdrant:
        condition: service_started
      kb-sync:
        condition: service_started
      document-worker:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - appnet

  kb-maintenance:
    build:
      context: ./kb-admin-api
      dockerfile: Dockerfile
    container_name: kb-maintenance
    user: "1000:1000"
    restart: unless-stopped
    command: ["python", "-m", "app.maintenance_worker"]
    environment:
      KB_PORTAL_DB_PATH: /portal-data/wissensportal.sqlite3
      KB_PORTAL_FILES_ROOT: /portal-data/files
      KB_SYNC_URL: http://kb-sync:8093
      KB_SYNC_INTERNAL_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      KB_MAINTENANCE_INTERVAL_SECONDS: "300"
      PORTAL_PUBLIC_URL: ${WEBUI_URL:-http://localhost:3004}
      KB_MAIL_TENANT_ID: ${KB_MAIL_TENANT_ID:-}
      KB_MAIL_CLIENT_ID: ${KB_MAIL_CLIENT_ID:-}
      KB_MAIL_CLIENT_SECRET: ${KB_MAIL_CLIENT_SECRET:-}
      KB_MAIL_SENDER: ${KB_MAIL_SENDER:-}
      KB_MAIL_CAPTURE_PATH: ${KB_MAIL_CAPTURE_PATH:-/portal-data/mail-capture.jsonl}
      MICROSOFT_CLIENT_TENANT_ID: ${MICROSOFT_CLIENT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      KB_GRAPH_ABSENCE_SYNC_ENABLED: ${KB_GRAPH_ABSENCE_SYNC_ENABLED:-false}
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-portal-data:/portal-data"
    depends_on:
      kb-admin-api:
        condition: service_healthy
      kb-sync:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - appnet

  kb-upload-worker:
    build:
      context: ./kb-admin-api
      dockerfile: Dockerfile
    container_name: kb-upload-worker
    restart: unless-stopped
    user: "${KB_ADMIN_UID:-1000}:${KB_ADMIN_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "-m", "app.upload_worker"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      KB_ROOT: /knowledgebases
      KB_STATE_PATH: /state/kb-sync-state.json
      QDRANT_URL: http://qdrant:6333
      OPENWEBUI_URL: http://open-webui:8080
      KB_SYNC_URL: http://kb-sync:8093
      DOCUMENT_WORKER_URL: http://document-worker:8090
      DOCUMENT_WORKER_API_KEY: ${DOC_WORKER_API_KEY:?DOC_WORKER_API_KEY is required}
      KB_CLAMAV_HOST: clamav
      KB_CLAMAV_PORT: "3310"
      IONOS_OPENAI_BASE_URL: ${IONOS_OPENAI_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      IONOS_API_KEY: ${IONOS_API_TOKEN:-${IONOS_API_KEY:?IONOS_API_TOKEN or IONOS_API_KEY is required}}
      IONOS_EMBEDDING_MODEL: ${IONOS_EMBEDDING_MODEL:-BAAI/bge-m3}
      IONOS_CHAT_MODEL_DEFAULT: ${IONOS_CHAT_MODEL_DEFAULT:-mistralai/Mistral-Small-24B-Instruct}
      KB_ADMIN_COLLECTIONS: kahleallgemein,kahlekontext,kahlerichtlinien
      KB_ADMIN_MAX_UPLOAD_BYTES: "52428800"
      KB_PORTAL_DB_PATH: /portal-data/wissensportal.sqlite3
      KB_PORTAL_FILES_ROOT: /portal-data/files
      KB_PORTAL_AUTO_ACTIVATION_ENABLED: "${KB_PORTAL_AUTO_ACTIVATION_ENABLED:-false}"
      PORTAL_ALLOWED_EMAIL_DOMAINS: ${PORTAL_ALLOWED_EMAIL_DOMAINS:-kahle.de}
      KB_ADMIN_TRASH_RETENTION_DAYS: "30"
      KB_ADMIN_MAINTENANCE_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      KB_ADMIN_UNLOCK_CODE_HASH: ${KB_ADMIN_UNLOCK_CODE_HASH:-}
      KB_ADMIN_UNLOCK_SESSION_SECRET: ${KB_ADMIN_UNLOCK_SESSION_SECRET:-}
      KB_ADMIN_UNLOCK_TTL_SECONDS: ${KB_ADMIN_UNLOCK_TTL_SECONDS:-28800}
      KB_ADMIN_UNLOCK_MAX_ATTEMPTS: ${KB_ADMIN_UNLOCK_MAX_ATTEMPTS:-5}
      KB_ADMIN_UNLOCK_BLOCK_SECONDS: ${KB_ADMIN_UNLOCK_BLOCK_SECONDS:-900}
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/knowledgebases:/knowledgebases"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-sync-state:/state:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-portal-data:/portal-data"
    depends_on:
      kb-admin-api:
        condition: service_healthy
      kb-sync:
        condition: service_started
      document-worker:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - appnet

  kb-backup:
    profiles: ["operations"]
    build:
      context: ./kb-admin-api
      dockerfile: Dockerfile
    container_name: kb-backup
    restart: unless-stopped
    command: ["python", "-m", "app.backup_worker"]
    environment:
      KB_PORTAL_ROOT: /portal-data
      KB_SYNC_STATE_ROOT: /kb-sync-state
      KB_BACKUP_PRIMARY_ROOT: /backups/primary
      KB_BACKUP_SECONDARY_ROOT: /backups-secondary
      KB_BACKUP_ENCRYPTION_KEY: ${KB_BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-portal-data:/portal-data:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-sync-state:/kb-sync-state:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/backups:/backups"
      - "${KAHLE_BACKUP_SECONDARY_ROOT:-C:/kahle-vinci-backups}:/backups-secondary"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - appnet

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    container_name: clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - appnet

  kb-admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
    container_name: kb-admin-dashboard
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    depends_on:
      kb-admin-api:
        condition: service_healthy
    networks:
      - appnet

  document-worker:
    build:
      context: ./document-worker
      dockerfile: Dockerfile
    container_name: document-worker
    restart: unless-stopped
    environment:
      STORAGE_DIR: /data
      TTL_HOURS: "24"
      MAX_FILE_MB: "50"
      TOOL_API_KEY: ${DOC_WORKER_API_KEY:?DOC_WORKER_API_KEY is required}
    volumes:
      - document_worker_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).getcode()==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - appnet

  academy-provisioner:
    build:
      context: ./academy-provisioner
      dockerfile: Dockerfile
    container_name: academy-provisioner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LEARNINGSUITE_API_KEY: ${LEARNINGSUITE_API_KEY:?LEARNINGSUITE_API_KEY is required}
      LEARNINGSUITE_API_BASE_URL: ${LEARNINGSUITE_API_BASE_URL:-https://api.learningsuite.io/api/v1}
      LEARNINGSUITE_COURSE_NAME: ${LEARNINGSUITE_COURSE_NAME:-Einführung in die KAHLE-Vinci Nutzung}
      LEARNINGSUITE_PROVISION_INTERVAL_SECONDS: ${LEARNINGSUITE_PROVISION_INTERVAL_SECONDS:-60}
      LEARNINGSUITE_ALLOWED_EMAILS: ${LEARNINGSUITE_ALLOWED_EMAILS:?LEARNINGSUITE_ALLOWED_EMAILS is required}
      MICROSOFT_CLIENT_TENANT_ID: ${MICROSOFT_CLIENT_TENANT_ID:?MICROSOFT_CLIENT_TENANT_ID is required}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:?MICROSOFT_CLIENT_ID is required}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:?MICROSOFT_CLIENT_SECRET is required}
      VINCI_WELCOME_MAIL_SENDER: ${VINCI_WELCOME_MAIL_SENDER:-oltmanns@kahle.de}
      OPENWEBUI_DB_PATH: /open-webui-data/webui.db
      LEARNINGSUITE_STATE_DB_PATH: /state/provisioning.sqlite3
    volumes:
      - open-webui:/open-webui-data:ro
      - academy_provisioner_state:/state
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - appnet

  personio-directory:
    build:
      context: ./personio-directory
      dockerfile: Dockerfile
    container_name: personio-directory
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PERSONIO_CLIENT_ID: ${PERSONIO_CLIENT_ID:?PERSONIO_CLIENT_ID is required}
      PERSONIO_API: ${PERSONIO_API:?PERSONIO_API is required}
      PERSONIO_DIRECTORY_INTERNAL_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      PERSONIO_DIRECTORY_QDRANT_URL: http://qdrant:6333
      PERSONIO_DIRECTORY_STATE_DB_PATH: /state/personio-directory.sqlite3
      PERSONIO_DIRECTORY_SYNC_INTERVAL_SECONDS: ${PERSONIO_DIRECTORY_SYNC_INTERVAL_SECONDS:-900}
    expose:
      - "8094"
    volumes:
      - personio_directory_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8094/health', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - appnet

  n8n:
    image: n8nio/n8n:2.16.1
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files/knowledgebases
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50000"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      IONOS_OPENAI_BASE_URL: ${IONOS_OPENAI_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      IONOS_API_KEY: ${IONOS_API_TOKEN:-${IONOS_API_KEY:?IONOS_API_TOKEN or IONOS_API_KEY is required}}
      IONOS_CHAT_MODEL_DEFAULT: ${IONOS_CHAT_MODEL_DEFAULT:-mistralai/Mistral-Small-24B-Instruct}
      IONOS_CHAT_MODEL_REASONING: ${IONOS_CHAT_MODEL_REASONING:-openai/gpt-oss-120b}
      IONOS_EMBEDDING_MODEL: ${IONOS_EMBEDDING_MODEL:-BAAI/bge-m3}
      OWUI_FILE_PROXY_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/n8n:/home/node/.n8n"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/knowledgebases:/home/node/.n8n-files/knowledgebases:ro"
      - open-webui:/mnt/open-webui-data
      - document_worker_data:/mnt/document-worker-data
    networks:
      - appnet

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - appnet

  kb-sync:
    build:
      context: ./kb-sync
      dockerfile: Dockerfile
    container_name: kb-sync
    restart: unless-stopped
    environment:
      KB_ROOT: /knowledgebases
      KB_STATE_PATH: /state/kb-sync-state.json
      QDRANT_URL: http://qdrant:6333
      IONOS_OPENAI_BASE_URL: ${IONOS_OPENAI_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      IONOS_API_KEY: ${IONOS_API_TOKEN:-${IONOS_API_KEY:?IONOS_API_TOKEN or IONOS_API_KEY is required}}
      IONOS_EMBEDDING_MODEL: ${IONOS_EMBEDDING_MODEL:-BAAI/bge-m3}
      KB_SYNC_COLLECTIONS: kahleallgemein,kahlekontext,kahlerichtlinien
      KB_ADMIN_API_URL: http://kb-admin-api:8092
      KB_ADMIN_MAINTENANCE_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      KB_SYNC_URL: http://kb-sync:8093
      HYBRID_COLLECTION_ALIAS: vinci_knowledge
      KB_SYNC_DEBOUNCE_SECONDS: "2"
      KB_SYNC_RECONCILE_INTERVAL_SECONDS: "300"
      KB_SYNC_CONTROL_PORT: "8093"
      KB_HYBRID_SNAPSHOT_PATH: /state/hybrid-bm25.json
      KB_SYNC_INTERNAL_API_KEY: ${OWUI_FILE_PROXY_API_KEY:?OWUI_FILE_PROXY_API_KEY is required}
      PORTAL_DB_PATH: /portal-data/wissensportal.sqlite3
      PORTAL_FILES_ROOT: /portal-data/files
    expose:
      - "8093"
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/knowledgebases:/knowledgebases:ro"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-sync-state:/state"
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/kb-portal-data:/portal-data:ro"
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - appnet

  searxng:
    image: searxng/searxng:2026.4.13-ee66b070a
    container_name: searxng
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - "${KAHLE_ROOT:?KAHLE_ROOT is required}/searxng:/etc/searxng"
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:?SEARXNG_SECRET_KEY is required}
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8080"
      BIND_ADDRESS: 0.0.0.0:8080
    networks:
      - appnet

volumes:
  open-webui:
    name: open-webui
  academy_provisioner_state: {}
  personio_directory_state: {}
  qdrant_data: {}
  document_worker_data: {}
  clamav_data: {}

networks:
  appnet:
    driver: bridge
